<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Implementation</title>
  </head>
  <body>
    <a href="../">← Back to Examples</a>
    <h1>Debug Implementation</h1>
    <p>
      Draws an SVG with <code>drawSVGDebug</code>.
      Bounding boxes:
      <span style="color: red">red = shapes</span>,
      <span style="color: blue">blue = groups</span>,
      <span style="color: green">green = transformed groups</span>.
      Paths:
      <span style="color: #969696">gray = path stroke</span>,
      <span style="color: #E94900">orange = bezier handles</span>,
      <span style="color: #008FE9">blue = anchor points</span>.
    </p>
    <div id="sketch-container"></div>

    <!-- Import p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <!-- Import the SVG loader library -->
    <script type="module" src="sketch.js"></script>
  </body>
</html>
